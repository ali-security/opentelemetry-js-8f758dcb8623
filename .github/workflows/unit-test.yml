name: Unit Tests
on:
  workflow_dispatch:

jobs:
  node-tests:
    strategy:
      fail-fast: false
      matrix:
        node_version:
          - "14"
          - "16"
          # Pinned to the last 18.x before 18.19.0. Node >=18.19 moved ESM module
          # customization hooks off-thread, which makes @opentelemetry/instrumentation's
          # `test:esm` harness (node --experimental-loader=./hook.mjs + import-in-the-middle)
          # re-run the mocha entry in the loader thread without its file arguments, so mocha
          # dies with "No test files found". Upstream's CI at this release ran Node 18.17.
          - "18.18.2"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}

      - name: Pin npm registry to release date
        run: npm config set registry 'https://:2023-08-08T13%3A21%3A04.540Z@time-machines-npm.sealsecurity.io/'

      # npm@latest resolves to the prerelease npm@10.0.0-pre.0 at this release date,
      # which requires node ^18.17.0 || >=20.5.0 and hard-fails EBADENGINE on node 16.
      # npm@9 supports ^14.17.0 || ^16.13.0 || >=18.0.0 — the whole matrix.
      - run: npm install -g npm@9

      - name: restore lerna
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            package-lock.json
            packages/*/node_modules
            packages/*/package-lock.json
            experimental/packages/*/node_modules
            experimental/packages/*/package-lock.json
          key: node-tests-${{ runner.os }}-${{ matrix.node_version }}-${{ hashFiles('package.json', 'packages/*/package.json', 'experimental/packages/*/package.json') }}-04292022

      - name: Bootstrap
        run: |
          npm install --ignore-scripts
          npx lerna bootstrap --no-ci --hoist --nohoist='zone.js' --ignore @opentelemetry/selenium-tests

      - name: Build 🔧
        run: |
          npm run compile

      - name: Unit tests
        run: |
          # TODO(legendecas): webpack https://stackoverflow.com/questions/69692842/error-message-error0308010cdigital-envelope-routinesunsupported
          if [ "${{ matrix.node_version }}" = "18.18.2" ]; then
            export NODE_OPTIONS=--openssl-legacy-provider
          fi
          npm run test

      - name: Pack @opentelemetry/core
        if: matrix.node_version == '18.18.2'
        working-directory: ./packages/opentelemetry-core
        run: |
          npm pack
          mv opentelemetry-core-1.15.2.tgz core-1.15.2.tgz

      - name: Upload @opentelemetry/core tarball
        if: matrix.node_version == '18.18.2'
        uses: actions/upload-artifact@v4
        with:
          name: core-1.15.2-tgz
          path: packages/opentelemetry-core/core-1.15.2.tgz
          if-no-files-found: error
  node-windows-tests:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Pin npm registry to release date
        run: npm config set registry 'https://:2023-08-08T13%3A21%3A04.540Z@time-machines-npm.sealsecurity.io/'

      # npm@latest resolves to the prerelease npm@10.0.0-pre.0 at this release date,
      # which requires node ^18.17.0 || >=20.5.0 and hard-fails EBADENGINE on node 16.
      # npm@9 supports ^14.17.0 || ^16.13.0 || >=18.0.0 — the whole matrix.
      - run: npm install -g npm@9

      - name: restore lerna
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            package-lock.json
            packages/*/node_modules
            packages/*/package-lock.json
            experimental/packages/*/node_modules
            experimental/packages/*/package-lock.json
          key: node-windows-tests-${{ runner.os }}-${{ hashFiles('package.json', 'packages/*/package.json', 'experimental/packages/*/package.json') }}

      - name: Bootstrap
        run: |
          npm install --ignore-scripts
          npx lerna bootstrap --no-ci --hoist --nohoist='zone.js' --ignore @opentelemetry/selenium-tests

      - name: Build 🔧
        run: |
          npm config set script-shell "C:\\Program Files\\git\\bin\\bash.exe"
          npm run compile

      - name: Unit tests
        run: npm run test
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Pin npm registry to release date
        run: npm config set registry 'https://:2023-08-08T13%3A21%3A04.540Z@time-machines-npm.sealsecurity.io/'

      - name: restore lerna
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            package-lock.json
            packages/*/node_modules
            packages/*/package-lock.json
            experimental/packages/*/node_modules
            experimental/packages/*/package-lock.json
          key: browser-tests-${{ runner.os }}-${{ hashFiles('package.json', 'packages/*/package.json', 'experimental/packages/*/package.json') }}-04292022

      - name: Bootstrap
        run: |
          npm install --ignore-scripts
          npx lerna bootstrap --no-ci --hoist --nohoist='zone.js' --ignore @opentelemetry/selenium-tests

      - name: Build 🔧
        run: |
          npm run compile

      - name: Unit tests
        run: npm run test:browser
  webworker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Pin npm registry to release date
        run: npm config set registry 'https://:2023-08-08T13%3A21%3A04.540Z@time-machines-npm.sealsecurity.io/'

      - name: restore lerna
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            package-lock.json
            packages/*/node_modules
            packages/*/package-lock.json
            experimental/packages/*/node_modules
            experimental/packages/*/package-lock.json
          key: webworker-tests-${{ runner.os }}-${{ hashFiles('package.json', 'packages/*/package.json', 'experimental/packages/*/package.json') }}-04292022

      - name: Bootstrap
        run: |
          npm install --ignore-scripts
          npx lerna bootstrap --no-ci --hoist --nohoist='zone.js'

      - name: Build 🔧
        run: |
          npm run compile

      - name: Unit tests
        run: npm run test:webworker
  api-eol-node-test:
    strategy:
      fail-fast: false
      matrix:
        node_version:
          - "8"
          - "10"
          - "12"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}

      - name: Pin npm registry to release date
        run: npm config set registry 'https://:2023-08-08T13%3A21%3A04.540Z@time-machines-npm.sealsecurity.io/'

      - name: Build
        working-directory: ./api
        run: |
          npm install --ignore-scripts
          npm install @types/mocha@^7 mocha@^7 ts-loader@^8 ts-mocha@^8
          node ../scripts/version-update.js
          npx tsc --build tsconfig.json tsconfig.esm.json

      - name: Test
        working-directory: ./api
        # running test:eol as node 8 is not supported anymore by the version of nyc we use, as we don't report coverage
        # for this step we leave it out.
        # Details: nyc requires istanbul-lib-report, which silently dropped support for Node.js v8 when going from
        # 3.0.0 to 3.0.1 by requiring make-dir@^4.0.0 to fix https://github.com/advisories/GHSA-c2qf-rxjj-qqgw.
        # make-dir does not support Node.js v8 anymore.
        run: npm run test:eol
